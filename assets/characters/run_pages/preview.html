<!doctype html><html lang="ru"><meta charset="utf-8"><title>JuAnnji — проверка бега</title><style>body{background:#20252b;color:#eee;font:18px system-ui;margin:30px}main{max-width:700px;margin:auto}#stage{width: min(85vw,542px);aspect-ratio:542/725.5;background-color:#52625b;background-size:200% 200%;border:1px solid #87948d}button,input{font:inherit;margin:8px;padding:8px}p{line-height:1.5}</style><main><h1>Просмотр 24 кадров бега</h1><p>Черновые кадры: последовательность и равномерность движения ещё требуют исправления.</p><div id="stage"></div><div><button id="play">Пауза</button><button id="prev">← Кадр</button><button id="next">Кадр →</button></div><label>Кадров в секунду <input id="fps" type="range" min="1" max="30" value="12"><span id="speed">12</span></label><p id="label"></p></main><script>let n=0,playing=true,last=0;const stage=document.querySelector('#stage'),label=document.querySelector('#label'),fps=document.querySelector('#fps');function draw(){let page=Math.floor(n/4)+1,cell=n%4;stage.style.backgroundImage=`url(run_page_${String(page).padStart(2,'0')}.png)`;stage.style.backgroundPosition=`${cell%2*100}% ${Math.floor(cell/2)*100}%`;label.textContent=`Кадр ${n+1} из 24 · страница ${page}`;}function step(d){playing=false;document.querySelector('#play').textContent='Воспроизвести';n=(n+d+24)%24;draw();}document.querySelector('#prev').onclick=()=>step(-1);document.querySelector('#next').onclick=()=>step(1);document.querySelector('#play').onclick=()=>{playing=!playing;document.querySelector('#play').textContent=playing?'Пауза':'Воспроизвести';last=performance.now();};fps.oninput=()=>document.querySelector('#speed').textContent=fps.value;function tick(t){if(playing&&t-last>=1000/Number(fps.value)){n=(n+1)%24;draw();last=t;}requestAnimationFrame(tick);}draw();requestAnimationFrame(tick);</script></html>
